# actionlint's bundled metadata for create-github-app-token predates v3, where `client-id`
# replaced the deprecated `app-id`. Remove once actionlint ships the new metadata.
paths:
  .github/workflows/agent.yml:
    ignore:
      - 'input "client-id" is not defined in action "actions/create-github-app-token@v3"'
      - 'missing input "app-id" which is required by action "actions/create-github-app-token@v3"'
