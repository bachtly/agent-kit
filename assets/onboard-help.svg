<svg xmlns="http://www.w3.org/2000/svg" width="826" height="385" viewBox="0 0 826 385" role="img" aria-label="Per-repo setup script">
<rect width="826" height="385" rx="10" fill="#0d1117"/>
<rect width="826" height="32" rx="10" fill="#161b22"/><rect y="22" width="826" height="10" fill="#161b22"/>
<circle cx="20" cy="16" r="6" fill="#ff5f57"/><circle cx="40" cy="16" r="6" fill="#febc2e"/><circle cx="60" cy="16" r="6" fill="#28c840"/>
<text x="413.0" y="21" fill="#8b949e" font-family="ui-sans-serif,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle">Per-repo setup script</text>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" xml:space="preserve">
<text x="18" y="56" fill="#7ee787" font-weight="bold">$ scripts/onboard-repo.sh --help</text>
<text x="18" y="75" fill="#e6edf3"># Configure an app repo for agent-kit. Idempotent: safe to re-run.</text>
<text x="18" y="94" fill="#e6edf3">#</text>
<text x="18" y="113" fill="#e6edf3"># Usage:</text>
<text x="18" y="132" fill="#e6edf3">#   scripts/onboard-repo.sh --repo owner/name [--require-review] [--no-environment] \</text>
<text x="18" y="151" fill="#e6edf3">#     [--client-id ID] [--key-file path/to/app.private-key.pem]</text>
<text x="18" y="170" fill="#e6edf3">#</text>
<text x="18" y="189" fill="#e6edf3"># Secrets come from the local environment and are piped to gh on stdin, never printed:</text>
<text x="18" y="208" fill="#e6edf3">#   AGENT_APP_PRIVATE_KEY_FILE (or --key-file)  GitHub App private key (.pem)</text>
<text x="18" y="227" fill="#e6edf3">#   CLAUDE_CODE_OAUTH_TOKEN and/or ANTHROPIC_API_KEY</text>
<text x="18" y="246" fill="#e6edf3"># A secret whose source is unset is skipped, so re-runs don&#x27;t need every value.</text>
<text x="18" y="265" fill="#e6edf3">#</text>
<text x="18" y="284" fill="#e6edf3"># --require-review  add the repo owner as required reviewer on the environment, so every run</text>
<text x="18" y="303" fill="#e6edf3">#                   waits for approval. Without it, re-running removes any required reviewer.</text>
<text x="18" y="322" fill="#e6edf3"># --no-environment  fallback for plans without private-repo environments: use repo secrets</text>
<text x="18" y="341" fill="#e6edf3">#                   (the caller workflow must then pass `environment: &#x27;&#x27;` and `secrets: inherit`)</text>
<text x="18" y="360" fill="#e6edf3">set -euo pipefail</text>
</g>
</svg>
